name: Deploy api
# Deploys automatically when a merge to main changes the api (or how it is deployed), after CI passes on that
# commit. It can also be started by hand.
# Every runtime setting lives in the GitHub `production` environment (secrets and variables), shared with the
# client build. This workflow copies the api's settings to Fly as staged secrets, then deploys.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deployApi.yml"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  workflow_dispatch:
    inputs:
      allow_protected_change:
        description: "Allow JOURNAL_KEY on Fly to differ from (or not be comparable with) the running app's. Only when no journal entries exist yet, or on purpose: a different key makes existing entries unreadable."
        type: boolean
        default: false
concurrency:
  group: deploy-api
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Copy settings from GitHub to Fly (staged; values are not printed)
        working-directory: ./api
        run: |
          # The app's origin is derived from APP_DOMAIN, the same variable the client deploy uses.
          if [ -z "$APP_DOMAIN" ]; then echo "::error::Missing in the GitHub production environment: APP_DOMAIN. Nothing was changed on Fly."; exit 1; fi
          export APP_ORIGIN="https://$APP_DOMAIN"
          ../.github/scripts/sync-fly-secrets.sh
        env:
          REQUIRED: SESSION_SECRET APP_ORIGIN PLATFORM_API_URL PLATFORM_SECRET_KEY GOOGLE_CLIENT_ID MONGO_URI JOURNAL_KEY
          OPTIONAL: PUBLIC_URL ADMIN_OWNER_EMAIL SUPPORT_EMAIL ZOHO_CLIENT_ID ZOHO_CLIENT_SECRET ZOHO_ACCOUNTS_URL RAZORPAY_KEY_ID RAZORPAY_INTERNATIONAL RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET
          # Changing JOURNAL_KEY makes every journal entry unreadable.
          PROTECTED: JOURNAL_KEY
          ALLOW_PROTECTED_CHANGE: ${{ inputs.allow_protected_change || false }}
          # Secrets
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PLATFORM_SECRET_KEY: ${{ secrets.PLATFORM_SECRET_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JOURNAL_KEY: ${{ secrets.JOURNAL_KEY }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          # Variables (not secret)
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          PLATFORM_API_URL: ${{ vars.PLATFORM_API_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          PUBLIC_URL: ${{ secrets.API_URL || vars.API_URL }}
          ADMIN_OWNER_EMAIL: ${{ secrets.ADMIN_OWNER_EMAIL || vars.ADMIN_OWNER_EMAIL }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL || vars.SUPPORT_EMAIL }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID || vars.ZOHO_CLIENT_ID }}
          ZOHO_ACCOUNTS_URL: ${{ secrets.ZOHO_ACCOUNTS_URL || vars.ZOHO_ACCOUNTS_URL }}
          # Public by design (it is sent to the checkout), but accepted from either place.
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID || vars.RAZORPAY_KEY_ID }}
          RAZORPAY_INTERNATIONAL: ${{ secrets.RAZORPAY_INTERNATIONAL || vars.RAZORPAY_INTERNATIONAL }}
      - name: Deploy
        working-directory: ./api
        run: flyctl deploy --remote-only --ha=false
      - name: Check the live api answers
        run: .github/scripts/wait-healthy.sh "${API_URL%/}/auth/healthz"
        env:
          API_URL: ${{ vars.API_URL }}
