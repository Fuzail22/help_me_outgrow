name: CI
on:
  push:
  pull_request:
  # Called by the deploy workflows, so a release only goes out after the same tests pass on that commit.
  workflow_call:
jobs:
  api:
    runs-on: ubuntu-latest
    # A real MongoDB for the upgrade test (0.5 data → this version); it is skipped without MONGO_TEST_URI.
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env: { MONGO_TEST_URI: "mongodb://localhost:27017" }
  client:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
        env: { VITE_PLATFORM_API_URL: "https://api.example.com", VITE_PUBLISHABLE_KEY: "pk_ci" }
  # The browser suite needs a checkout of notification-service beside this repo; see e2e/stack.mjs (NS_REPO).
