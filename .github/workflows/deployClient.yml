name: Deploy client
# Deploys automatically when a merge to main changes the app, after CI passes on that commit; also by hand.
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/deployClient.yml"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  workflow_dispatch:
concurrency:
  group: deploy-client
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    # Same settings as the api deploy: one GitHub `production` environment for the whole app.
    environment: production
    env:
      VITE_PLATFORM_API_URL: ${{ vars.PLATFORM_API_URL }}
      VITE_API_URL: ${{ vars.API_URL }}
      VITE_PUBLISHABLE_KEY: ${{ vars.PUBLISHABLE_KEY }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      VITE_HELPLINE_URL: ${{ vars.HELPLINE_URL }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
    steps:
      - name: Check settings
        # A missing value would publish a site that cannot sign in or subscribe: stop before building.
        run: |
          missing=""
          for pair in PLATFORM_API_URL:VITE_PLATFORM_API_URL API_URL:VITE_API_URL PUBLISHABLE_KEY:VITE_PUBLISHABLE_KEY GOOGLE_CLIENT_ID:VITE_GOOGLE_CLIENT_ID APP_DOMAIN:APP_DOMAIN; do
            v="${pair#*:}"; [ -n "${!v}" ] || missing="$missing ${pair%%:*}"
          done
          if [ -n "$missing" ]; then echo "::error::Missing variables in the GitHub production environment:$missing. Nothing was published."; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        working-directory: ./client
        run: npm ci
      - name: Build
        working-directory: ./client
        run: |
          # An empty helpline variable falls back to the default in the app.
          [ -n "$VITE_HELPLINE_URL" ] || unset VITE_HELPLINE_URL
          npm run build
      - name: Deploy
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: ./client/dist
          # Set the custom domain before the first real subscriber: subscriptions are bound to the origin.
          fqdn: ${{ vars.APP_DOMAIN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the live site serves this build
        # GitHub's own "pages build and deployment" job publishes the gh-pages push; wait until the live page
        # references this build's script (its file name carries a content hash), so "green" means "live".
        run: |
          asset="$(grep -Eo 'assets/index-[A-Za-z0-9_-]+\.js' client/dist/index.html | head -1)"
          [ -n "$asset" ] || { echo "::error::could not find the built script in client/dist/index.html"; exit 1; }
          TRIES=36 DELAY=10 .github/scripts/wait-healthy.sh "https://$APP_DOMAIN/?release=$GITHUB_SHA" "$asset"
